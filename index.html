<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AKITA 分红一键提取</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .card { background: #151d2f; border: 1px solid #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; }
    h1 { font-size: 20px; margin-top: 0; margin-bottom: 6px; color: #f59e0b; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .stat-box { background: #0b0f19; border: 1px solid #222f46; border-radius: 14px; padding: 16px; margin-bottom: 20px; text-align: left; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-label { color: #94a3b8; }
    .stat-value { font-weight: 600; color: #38bdf8; font-family: monospace; }
    .stat-highlight { color: #10b981; font-size: 18px; font-weight: bold; font-family: monospace; }
    button { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 12px; color: white; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35); }
    button:active { transform: scale(0.98); }
    button:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 13px; min-height: 20px; word-break: break-all; line-height: 1.5; }
    .success { color: #10b981; font-weight: 600; }
    .error { color: #ef4444; }
    .tips { margin-top: 16px; font-size: 12px; color: #64748b; line-height: 1.5; text-align: left; background: #0f172a; padding: 12px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AKITA 分红一键提取</h1>
    <div class="subtitle">BSC 链上智能合约直连提取</div>
    
    <div class="stat-box">
      <div class="stat-row">
        <span class="stat-label">连接钱包:</span>
        <span class="stat-value" id="wallet-addr">未连接</span>
      </div>
      <div class="stat-row" style="margin-top: 14px; align-items: baseline;">
        <span class="stat-label">待领 BNB 分红:</span>
        <span class="stat-highlight" id="withdrawable-val">--</span>
      </div>
      <div class="stat-row" style="margin-top: 10px;">
        <span class="stat-label">历史已领取:</span>
        <span class="stat-value" id="withdrawn-val" style="color:#94a3b8">--</span>
      </div>
    </div>

    <button id="btn-claim" onclick="handleClick()">连接钱包并提取</button>
    <div id="status"></div>

    <div class="tips">
      • 提取目标合约：0x382c...f4d7 (AKITA Dividends)<br>
      • 交易将调用 claim() 函数，直接将 BNB 退回你的当前钱包。<br>
      • Gas 费预计 ~0.00015 BNB（约 0.1 美元）。
    </div>
  </div>

  <script>
    const DIV_CONTRACT = "0x382cd205c2974d4bcf8f025df2c8bb43cdc4f4d7";
    const CLAIM_SELECTOR = "0x4e71d92d";
    const WITHDRAWABLE_SEL = "0xce513b6f";
    const WITHDRAWN_SEL = "0xbf2d43fc";
    let userAccount = null;

    function getProvider() {
      return window.ethereum || (window.web3 && window.web3.currentProvider);
    }

    async function connectWallet() {
      const provider = getProvider();
      if (!provider) {
        document.getElementById("status").innerHTML = "<span class='error'>未检测到 Web3 钱包，请在 Ave.ai 的 DApp 浏览器中打开</span>";
        document.getElementById("wallet-addr").innerText = "未连接";
        document.getElementById("withdrawable-val").innerText = "--";
        return null;
      }
      try {
        const accounts = await provider.request({ method: "eth_requestAccounts" });
        if (accounts && accounts.length > 0) {
          userAccount = accounts[0];
          document.getElementById("wallet-addr").innerText = userAccount.slice(0, 6) + "..." + userAccount.slice(-4);
          document.getElementById("withdrawable-val").innerText = "读取中...";
          queryDividend(userAccount);
          return userAccount;
        }
      } catch (err) {
        document.getElementById("status").innerHTML = "<span class='error'>钱包连接被拒绝: " + (err.message || err) + "</span>";
      }
      return null;
    }

    async function queryDividend(addr) {
      try {
        const addrPadded = addr.slice(2).toLowerCase().padStart(64, "0");
        // 1. withdrawable
        const resW = await fetch("https://bsc-dataseed.binance.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0", id: 1, method: "eth_call",
            params: [{ to: DIV_CONTRACT, data: WITHDRAWABLE_SEL + addrPadded }, "latest"]
          })
        });
        const dataW = await resW.json();
        const bnbW = Number(BigInt(dataW.result || "0x0")) / 1e18;
        
        // 2. withdrawn
        const resD = await fetch("https://bsc-dataseed.binance.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0", id: 1, method: "eth_call",
            params: [{ to: DIV_CONTRACT, data: WITHDRAWN_SEL + addrPadded }, "latest"]
          })
        });
        const dataD = await resD.json();
        const bnbD = Number(BigInt(dataD.result || "0x0")) / 1e18;

        document.getElementById("withdrawable-val").innerText = bnbW.toFixed(6) + " BNB";
        document.getElementById("withdrawn-val").innerText = bnbD.toFixed(6) + " BNB";

        const btn = document.getElementById("btn-claim");
        if (bnbW <= 0.000001) {
          btn.disabled = true;
          btn.innerText = bnbD > 0 ? "已全部提取完毕" : "暂无可领分红";
        } else {
          btn.disabled = false;
          btn.innerText = "一键提取到钱包";
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function handleClick() {
      const provider = getProvider();
      if (!provider) {
        alert("请在 Ave.ai 的 DApp 浏览器中打开本网页");
        return;
      }
      if (!userAccount) {
        const acc = await connectWallet();
        if (!acc) return;
      }
      claimDividends();
    }

    async function claimDividends() {
      const provider = getProvider();
      const btn = document.getElementById("btn-claim");
      const statusEl = document.getElementById("status");
      btn.disabled = true;
      btn.innerText = "请在 Ave 弹窗中确认...";
      statusEl.innerHTML = "<span style='color:#38bdf8'>正在唤起钱包确认...</span>";

      try {
        const txHash = await provider.request({
          method: "eth_sendTransaction",
          params: [{
            from: userAccount,
            to: DIV_CONTRACT,
            data: CLAIM_SELECTOR,
            gas: "0x186a0" // 100,000 gas
          }]
        });
        statusEl.innerHTML = `<span class='success'>🎉 提取已提交！<br>交易哈希: ${txHash.slice(0,10)}...${txHash.slice(-6)}<br>BNB 将在数秒内自动到账。</span>`;
        btn.innerText = "已提交提取";
        setTimeout(() => queryDividend(userAccount), 3000);
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "重新尝试提取";
        statusEl.innerHTML = `<span class='error'>交易未完成: ${err.message || err}</span>`;
      }
    }

    window.addEventListener("load", () => {
      setTimeout(connectWallet, 300);
    });
  </script>
</body>
</html>
